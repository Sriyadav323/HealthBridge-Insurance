spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/healthbridge}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
server.port=${SERVER_PORT:8081}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Keep request bodies, passwords, and CSRF tokens out of web debug logs.
logging.level.org.springframework.web=INFO
spring.mvc.log-request-details=false
